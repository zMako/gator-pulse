<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gator Pulse</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2342ffa0'/%3E%3C/svg%3E" />
  </head>
  <body data-theme="night">
    <div id="app"></div>
    <div id="labels"></div>
    <header id="hud">
      <div class="brand panel"><b>Gator Pulse</b><span>SF State · live campus</span></div>
      <div class="seg panel" role="group" aria-label="Lighting">
        <button type="button" data-set-theme="auto" title="Follow the time on the slider">Auto</button>
        <button type="button" data-set-theme="day">Day</button>
        <button type="button" data-set-theme="night">Night</button>
      </div>
    </header>
    <aside id="side" class="panel">
      <div class="tabs" role="tablist" aria-label="Side panel">
        <button type="button" role="tab" id="tab-guide" data-tab="guide" aria-controls="guide" aria-selected="true">Guide</button>
        <button type="button" role="tab" id="tab-events" data-tab="events" aria-controls="events" aria-selected="false">Events</button>
        <button type="button" role="tab" id="tab-add" data-tab="add" aria-controls="add" aria-selected="false">Add</button>
      </div>
      <section id="guide" role="tabpanel" aria-labelledby="tab-guide"></section>
      <section id="events" role="tabpanel" aria-labelledby="tab-events" hidden></section>
      <section id="add" role="tabpanel" aria-labelledby="tab-add" hidden></section>
    </aside>
    <aside id="card" class="panel" aria-label="Event details" hidden></aside>
    <footer id="timeline" class="panel" aria-label="Time"></footer>
    <div id="credit">
      Map data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors ·
      Events from SF State's student organisations listing and from students
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
